name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      # Private names the opsec gate refuses (tests/test_atlas_docs.py runs it on this repo's docs and bakes/), kept
      # out of git. Empty (e.g. a PR from a fork, which gets no secrets) skips only the name check.
      OPSEC_DENYLIST: ${{ secrets.OPSEC_DENYLIST }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # hatch-vcs derives the version from git
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
      - run: uv venv --python 3.12 && uv pip install -e ".[server,dev]"
      - run: make lint
      - run: make test

  # The static demo's page checks, without the painted tiles (they are baked on a GPU host and are not in git):
  # the demo strip pasted into site/index.html matches site/vendor/dh/dh-strip.html, <html> marks Atlas current,
  # there is no inline script, and the CSP renders; and the imported argus-atlas docs (docs/atlas/) match their
  # record, pass the opsec gate, render, and hold every anchor the panel links to. The full build is `make static`
  # with tiles in var/maps; it also refuses tiles baked at another argus-atlas commit than the docs.
  static:
    runs-on: ubuntu-latest
    env:
      # Private names the opsec gate refuses in the imported docs, kept out of git. Empty (e.g. a PR from a fork,
      # which gets no secrets) skips only the name check.
      OPSEC_DENYLIST: ${{ secrets.OPSEC_DENYLIST }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pillow>=10.0" "markdown-it-py>=3.0,<5" "argus-cortex>=0.14,<0.15"
      - run: python scripts/build_static.py --check

  # The vendored Dragonhound shared layer (site/vendor/dh/): fails if a copy was edited here, or no longer matches
  # the published v1 source. A newer upstream version is a warning: re-sync from dragonhound-site.
  dh-shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node site/vendor/dh/sync-shared.mjs --check . --against https://dragonhound.dev/brand/v1/manifest.json --allow-outdated

  # The browser arena (arena/): build it without tiles and check that the Pyodide bundle plays the same game as the
  # CPython reference, tick for tick (arena/test/parity.test.mjs).
  arena:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: arena/package-lock.json
      - uses: actions/cache@v4
        with:
          path: arena/.cache
          key: pyodide-wheels-${{ hashFiles('arena/package-lock.json') }}
      - run: uv venv --python 3.12 && uv pip install -e ".[server,dev]"
      - run: npm ci --prefix arena
      - run: make arena-test

  # Schema and tick tests against Postgres 16 + PostGIS + h3-pg, built from db/Dockerfile.
  db:
    runs-on: ubuntu-latest
    env:
      # Private names the opsec gate refuses (tests/test_atlas_docs.py runs it on this repo's docs and bakes/), kept
      # out of git. Empty (e.g. a PR from a fork, which gets no secrets) skips only the name check.
      OPSEC_DENYLIST: ${{ secrets.OPSEC_DENYLIST }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
      - run: uv venv --python 3.12 && uv pip install -e ".[server,dev]"
      - run: make db-up
      - run: make test-db

  suite-rules:
    # argus-ci suite rules: lint rules that each eliminate a finding class. New violations fail;
    # existing ones are in .suite-rules-baseline.json, which may only shrink.
    uses: smk762/argus-ci/.github/workflows/suite-rules.yml@v1
