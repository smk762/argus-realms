name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      # Private names the opsec gate refuses (tests/test_atlas_docs.py runs it on this repo's docs and bakes/), kept
      # out of git. Empty (e.g. a PR from a fork, which gets no secrets) skips only the name check.
      OPSEC_DENYLIST: ${{ secrets.OPSEC_DENYLIST }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # hatch-vcs derives the version from git
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
      - run: uv venv --python 3.12 && uv pip install -e ".[server,dev]"
      - run: make lint
      - run: make test

  # The static demo's page checks, without the painted tiles (they are baked on a GPU host and are not in git):
  # the demo strip pasted into site/index.html matches site/vendor/dh/dh-strip.html, <html> marks Atlas current,
  # there is no inline script, and the CSP renders; and the imported argus-atlas docs (docs/atlas/) match their
  # record, pass the opsec gate, render, and hold every anchor the panel links to. The full build is `make static`
  # with tiles in var/maps; it also refuses tiles baked at another argus-atlas commit than the docs.
  static:
    runs-on: ubuntu-latest
    env:
      # Private names the opsec gate refuses in the imported docs, kept out of git. Empty (e.g. a PR from a fork,
      # which gets no secrets) skips only the name check.
      OPSEC_DENYLIST: ${{ secrets.OPSEC_DENYLIST }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pillow>=10.0" "markdown-it-py>=3.0,<5" "argus-cortex>=0.14,<0.15"
      - run: python scripts/build_static.py --check

  # The vendored Dragonhound shared layer (site/vendor/dh/): fails if a copy was edited here, or no longer matches
  # the published v1 source. A newer upstream version is a warning: re-sync from dragonhound-site.
  dh-shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node site/vendor/dh/sync-shared.mjs --check . --against https://dragonhound.dev/brand/v1/manifest.json --allow-outdated

  # The browser arena (arena/): build it without tiles and check that the Pyodide bundle plays the same game as the
  # CPython reference, tick for tick (arena/test/parity.test.mjs).
  arena:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: arena/package-lock.json
      - uses: actions/cache@v4
        with:
          path: arena/.cache
          key: pyodide-wheels-${{ hashFiles('arena/package-lock.json') }}
      - run: uv venv --python 3.12 && uv pip install -e ".[server,dev]"
      - run: npm ci --prefix arena
      - run: make arena-test

  # Schema and tick tests against Postgres 16 + PostGIS + h3-pg, built from db/Dockerfile.
  db:
    runs-on: ubuntu-latest
    env:
      # Private names the opsec gate refuses (tests/test_atlas_docs.py runs it on this repo's docs and bakes/), kept
      # out of git. Empty (e.g. a PR from a fork, which gets no secrets) skips only the name check.
      OPSEC_DENYLIST: ${{ secrets.OPSEC_DENYLIST }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
      - run: uv venv --python 3.12 && uv pip install -e ".[server,dev]"
      - run: make db-up
      - run: make test-db

  suite-rules:
    # argus-ci suite rules: lint rules that each eliminate a finding class. New violations fail;
    # existing ones are in .suite-rules-baseline.json, which may only shrink.
    uses: smk762/argus-ci/.github/workflows/suite-rules.yml@v1

  # The shared world on Kubernetes (deploy/k8s/): a kind cluster with Calico (so NetworkPolicy is enforced), the
  # images built here and pinned by image id, CloudNativePG pinned by version and manifest sha256. The smoke test
  # (scripts/k8s.py smoke): API healthy, both regions ticking, a scripted order applied, a worker killed mid-game
  # resuming from the database, and Postgres refusing a pod without the db-client label.
  k8s:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CALICO_VERSION: v3.33.0
      CALICO_SHA256: 2de8f47595fb9c41b3f47d7b767a1f8e72ecf84057af834738ff12689a234da5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
      - run: uv venv --python 3.12 && uv pip install -e ".[server,dev]"
      - uses: helm/kind-action@v1
        with:
          version: v0.33.0
          kubectl_version: v1.36.6
          cluster_name: realms
          config: deploy/k8s/kind.yaml
          wait: 0s  # no CNI yet: the node is NotReady until Calico is up
      - name: Calico
        run: |
          curl -fsSLo calico.yaml "https://raw.githubusercontent.com/projectcalico/calico/${CALICO_VERSION}/manifests/calico.yaml"
          echo "${CALICO_SHA256}  calico.yaml" | sha256sum -c -
          kubectl apply -f calico.yaml
          kubectl -n kube-system rollout status daemonset/calico-node --timeout=300s
          kubectl wait node --all --for=condition=Ready --timeout=300s
      - run: make k8s-images
      - run: kind load docker-image --name realms $(cat var/k8s/images.txt)
      - run: make k8s-deploy
      - run: make k8s-smoke
      - name: Diagnostics
        if: failure()
        run: |
          kubectl get all,clusters.postgresql.cnpg.io,databases.postgresql.cnpg.io,networkpolicies -A -o wide || true
          kubectl -n realms describe pods || true
          kubectl -n realms logs -l app.kubernetes.io/part-of=atlas-realms --all-containers --prefix --tail=200 || true
          kubectl -n realms logs -l cnpg.io/cluster=realms-db --all-containers --prefix --tail=200 || true
          kubectl -n cnpg-system logs deployment/cnpg-controller-manager --tail=200 || true
