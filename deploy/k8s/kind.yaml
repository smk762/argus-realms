# CI's cluster (.github/workflows/ci.yml, job k8s). kind's default CNI ignores NetworkPolicy, so it is replaced with
# Calico, whose default pool is this pod subnet; the smoke test checks the policies are enforced.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  disableDefaultCNI: true
  podSubnet: 192.168.0.0/16
