# Migrates and seeds every region's database (`atlas_realms.regions prepare`), retrying while the server and the
# `Database`s come up. The API is not ready, and the workers' init containers wait, until it has run. Re-running it
# is safe: migrations are forward-only and recorded, and seeding never touches ownership. A Job's pod template is
# immutable, so `scripts/k8s.py deploy` deletes the old one before applying.
apiVersion: batch/v1
kind: Job
metadata:
  name: realms-migrate
  labels:
    app.kubernetes.io/name: realms-migrate
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: realms-migrate
        realms.dragonhound.dev/db-client: "true"
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: atlas-realms:unpinned
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "atlas_realms.regions", "prepare", "$(REGIONS)", "--timeout", "600"]
          env:
            - name: REGIONS
              valueFrom:
                configMapKeyRef:
                  name: realms-regions
                  key: regions
            - name: ATLAS_REALMS_DSN
              value: host=realms-db-rw port=5432 sslmode=require
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: realms-db-app
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: realms-db-app
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
