# GENERATED by `make k8s-regions` (scripts/k8s.py regions) from regions.txt. Do not edit: add a line there instead.
# Per region: its database on the shared server, and its tick worker (one replica, never two).
apiVersion: v1
kind: ConfigMap
metadata:
  name: realms-regions
data:
  regions: cook-strait,iceland
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: realms-db-cook-strait
  labels:
    realms.dragonhound.dev/region: cook-strait
spec:
  cluster:
    name: realms-db
  name: realms_cook_strait
  owner: realms
  databaseReclaimPolicy: retain
  extensions:
    - name: postgis
      ensure: present
    - name: postgis_raster
      ensure: present
    - name: h3
      ensure: present
    - name: h3_postgis
      ensure: present
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: realms-tick-cook-strait
  labels:
    app.kubernetes.io/name: realms-tick
    realms.dragonhound.dev/region: cook-strait
spec:
  replicas: 1
  # Never two workers for one region, not even during a rollout. (The tick lock would make the second skip anyway.)
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: realms-tick
      realms.dragonhound.dev/region: cook-strait
  template:
    metadata:
      labels:
        app.kubernetes.io/name: realms-tick
        realms.dragonhound.dev/region: cook-strait
        realms.dragonhound.dev/db-client: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Until the migrate job has migrated and seeded this region's database.
      initContainers:
        - name: wait-for-region
          image: atlas-realms:unpinned
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "atlas_realms.regions", "wait", "cook-strait", "--timeout", "900"]
          env:
            - name: ATLAS_REALMS_DSN
              value: host=realms-db-rw port=5432 sslmode=require
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: realms-db-app
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: realms-db-app
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: tick
          image: atlas-realms:unpinned
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - atlas_realms.tick.runner
            - --loop
            - --no-migrate
            - --region
            - cook-strait
            - --heartbeat
            - /run/realms/heartbeat
          env:
            - name: ATLAS_REALMS_DSN
              value: host=realms-db-rw port=5432 sslmode=require
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: realms-db-app
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: realms-db-app
                  key: password
          # Touched after every tick attempt (60 s apart, each at most ~15 s waiting for drand). Five minutes without
          # one means the loop is stuck: restart it. The state is in the database, so a restart loses nothing.
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/run/realms/heartbeat') > 300)"
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 2
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: run
              mountPath: /run/realms
      volumes:
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
---
