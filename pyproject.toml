[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "atlas-realms"
dynamic = ["version"]
description = "A tick-based territory game on an H3 hex grid over maps painted by argus-atlas"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "dragonhound" }]
dependencies = [
    # Base install is pure Python (no GDAL): the server uses it for chunk addressing only.
    "argus-atlas>=0.5,<0.6",
    # argus_cortex.hashing.sha256_hex (scripts/atlas_docs.py).
    "argus-cortex>=0.14,<0.15",
    "h3>=4.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "structlog>=24.0",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.27", "pmtiles>=3.3", "pillow>=10.0"]
# httpx2 backs starlette's TestClient (the httpx path is deprecated), as in argus-atlas.
# markdown-it-py renders the imported argus-atlas docs into docs.html at build time (scripts/atlas_docs.py).
# pyyaml reads the Kubernetes manifests in tests/test_k8s.py.
dev = ["pytest>=8.0", "ruff==0.15.16", "httpx>=0.27", "httpx2>=2.7", "markdown-it-py>=3.0,<5", "numpy>=1.26", "pyyaml>=6.0"]

[tool.hatch.version]
source = "vcs"
# No tags yet: start at 0.0.0 rather than failing the build.
fallback-version = "0.0.0"

[tool.hatch.version.raw-options]
# Only v* tags are versions: a tile set's tag (tiles-<sha>, docs/deploy.md section 6) can't be parsed as one.
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "v[0-9]*"]

[tool.hatch.build.hooks.vcs]
version-file = "src/atlas_realms/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_realms"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: statistical checks that run many battles"]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["src/atlas_realms/_version.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]
